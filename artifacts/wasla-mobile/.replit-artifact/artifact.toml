kind = "mobile"
previewPath = "/"
title = "وصلة — تطبيق محادثات"
description = "تطبيق محادثات عربي يعتمد على أكواد آمنة لبدء التواصل، مع موافقات قبل المحادثة، مجموعات، مزامنة فورية، ودعم العمل دون اتصال."
version = "1.0.0"
id = "artifacts/wasla-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20518

[services.development]
run = "pnpm --filter @workspace/wasla-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wasla-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/wasla-mobile", "run", "serve" ]

[services.env]
PORT = "20518"
BASE_PATH = "/"
