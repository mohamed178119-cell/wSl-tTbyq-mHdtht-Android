name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🔧 Install dependencies
        run: npm install

      - name: 🚀 Setup EAS CLI
        run: npm install -g eas-cli

      - name: 🔐 Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --local

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wasla-apk
          path: '**/*.apk'
          retention-days: 30
