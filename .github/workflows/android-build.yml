name: Build Wasla Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/wasla-mobile/**"
      - "lib/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API domain
        run: |
          if [ -z "$EXPO_PUBLIC_DOMAIN" ]; then
            echo "Missing GitHub Actions variable: EXPO_PUBLIC_DOMAIN"
            echo "Set it to the public API host without https://"
            exit 1
          fi

      - name: Generate Android project
        working-directory: artifacts/wasla-mobile
        run: pnpm exec expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: artifacts/wasla-mobile/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wasla-android-apk
          path: artifacts/wasla-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
